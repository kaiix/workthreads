[project]
name = "workthreads"
version = "0.1.0"
description = "Developer-first git worktree workflow CLI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { email = "kvn.hou@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "developer-tools", "git", "worktree"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/kaiix/workthreads"
Repository = "https://github.com/kaiix/workthreads"
Issues = "https://github.com/kaiix/workthreads/issues"

[project.scripts]
wt = "workthreads.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/docs",
  "/LICENSE",
  "/pyproject.toml",
  "/README.md",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workthreads"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
